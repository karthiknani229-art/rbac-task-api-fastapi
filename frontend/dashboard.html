<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<body class="bg-gray-100 min-h-screen">

  <!-- Navbar -->
  <div class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-lg font-semibold">RBAC Task Dashboard</h1>
    <button onclick="logout()" 
      class="bg-red-500 text-white px-4 py-1 rounded hover:bg-red-600">
      Logout
    </button>
  </div>

  <!-- Main Container -->
  <div class="max-w-2xl mx-auto mt-6 p-4">

    <!-- Add Task -->
    <div class="bg-white p-4 rounded-xl shadow mb-6">
      <h2 class="text-md font-medium mb-2">Add Task</h2>
      
      <input id="taskTitle" type="text" placeholder="Task title"
        class="w-full p-2 border rounded mb-2">

      <textarea id="taskDesc" placeholder="Task description"
        class="w-full p-2 border rounded mb-2"></textarea>

      <button onclick="createTask()"
        class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">
        Create Task
      </button>
    </div>

    <!-- Task List -->
    <div>
      <h2 class="text-md font-medium mb-2">Your Tasks</h2>
      <div id="taskList" class="space-y-3"></div>
    </div>

  </div>
<script src="app.js"></script>
</body>
</body>
</html>
